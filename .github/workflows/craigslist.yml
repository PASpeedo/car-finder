name: Craigslist deal intake
# Free email alerts, researched seller-message templates, and tested mobile code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/craigslist.yml'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: craigslist-deal-intake
  cancel-in-progress: false
jobs:
  import-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser and scoring tests
        run: python -m unittest -v test_rules test_email
      - name: Check mobile app JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(); Path('/tmp/porsche-hunter.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/porsche-hunter.js
          node --check sw.js
      - name: Import official Craigslist saved-search emails
        env:
          CL_IMAP_USER: ${{ secrets.CL_IMAP_USER }}
          CL_IMAP_APP_PASSWORD: ${{ secrets.CL_IMAP_APP_PASSWORD }}
          CL_IMAP_HOST: ${{ vars.CL_IMAP_HOST || 'imap.gmail.com' }}
        run: python collector/craigslist_email.py
      # Debugging prints bot username and pending-update count, never bot credentials.
      - name: Send Telegram lock screen alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/telegram_notify.py
      - name: Publish candidate URLs only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json telegram_state.json collector_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Craigslist candidate feed"
            git push
          fi

      - name: Warn via Telegram on ingestion or notification failures
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/health_alert.py
